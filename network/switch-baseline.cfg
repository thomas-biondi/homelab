! Configuration de reference du commutateur, apres remise a zero complete.
! Adresses et empreintes de mots de passe remplacees par des valeurs generiques.
!
! Remise a zero d'un equipement d'occasion, en trois commandes :
!   erase startup-config
!   delete flash:vlan.dat     <- indispensable : les VLAN sont stockes a part
!   reload
! Sans la deuxieme, l'integralite des VLAN de l'ancien proprietaire
! reapparait apres redemarrage.
!
version 12.2
service password-encryption
!
hostname sw-lab
!
enable secret 5 <hash>
username admin privilege 15 secret 5 <hash>
!
! Mode transparent : le commutateur gere ses VLAN localement et ne les propage
! ni ne les accepte. Le mode serveur par defaut permet a un equipement branche
! plus tard d'ecraser la base locale.
vtp mode transparent
!
spanning-tree mode pvst
spanning-tree extend system-id
!
ip domain-name home.arpa
ip ssh version 2
!
! VLAN
vlan 10
 name donnees
vlan 20
 name voix
vlan 30
 name iot
!
! Port d'acces vers la passerelle Internet
interface GigabitEthernet0/1
 description Passerelle
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
!
! Trunk vers le serveur (router-on-a-stick)
! VLAN natif non etiquete : filet de securite. L'interface physique du serveur
! continue de recevoir le reseau existant meme si les sous-interfaces sont
! mal declarees, ce qui rend la bascule reversible.
interface GigabitEthernet0/2
 description Trunk vers serveur
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
 spanning-tree portfast trunk
!
! Port d'acces de test
interface FastEthernet0/1
 description Poste VLAN donnees
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
! Interface de management (SVI). Adresse choisie hors de la plage distribuee
! par le serveur DHCP, sans quoi un bail entrerait en conflit.
interface Vlan1
 ip address 192.168.1.2 255.255.255.0
!
ip default-gateway 192.168.1.1
!
! Serveurs web d'administration desactives : inutiles en administration CLI,
! et surface d'attaque sur un logiciel sans correctif depuis une decennie.
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 15
 exec-timeout 15 0
 login local
 transport input ssh
!
end
